<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- FluidSur titlebutton: restore.  Monochrome line icon, no traffic light.
     One group per Aurorae state id; the 16x16 rect pins the bounds. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
     viewBox="0 0 16 16" version="1.1">
  <g id="active-center">
    <rect width="16" height="16" fill="#000000" opacity="0"/>
    <g fill="none" stroke="#e1e1e1" stroke-width="1.35"
       stroke-linecap="round" stroke-linejoin="round" opacity="1">
      <path d="M4.6 6.8h4.9v4.7H4.6z"/><path d="M7.2 4.6h4.2v4.2"/>
    </g>
  </g>
  <g id="inactive-center">
    <rect width="16" height="16" fill="#000000" opacity="0"/>
    <g fill="none" stroke="#787878" stroke-width="1.35"
       stroke-linecap="round" stroke-linejoin="round" opacity="1">
      <path d="M4.6 6.8h4.9v4.7H4.6z"/><path d="M7.2 4.6h4.2v4.2"/>
    </g>
  </g>
  <g id="hover-center">
    <rect width="16" height="16" fill="#000000" opacity="0"/>
    <rect width="16" height="16" rx="4" fill="#e1e1e1" opacity="0.11"/>
    <g fill="none" stroke="#e1e1e1" stroke-width="1.35"
       stroke-linecap="round" stroke-linejoin="round" opacity="1">
      <path d="M4.6 6.8h4.9v4.7H4.6z"/><path d="M7.2 4.6h4.2v4.2"/>
    </g>
  </g>
  <g id="pressed-center">
    <rect width="16" height="16" fill="#000000" opacity="0"/>
    <rect width="16" height="16" rx="4" fill="#e1e1e1" opacity="0.2"/>
    <g fill="none" stroke="#e1e1e1" stroke-width="1.35"
       stroke-linecap="round" stroke-linejoin="round" opacity="1">
      <path d="M4.6 6.8h4.9v4.7H4.6z"/><path d="M7.2 4.6h4.2v4.2"/>
    </g>
  </g>
  <g id="deactivated-center">
    <rect width="16" height="16" fill="#000000" opacity="0"/>
    <g fill="none" stroke="#e1e1e1" stroke-width="1.35"
       stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
      <path d="M4.6 6.8h4.9v4.7H4.6z"/><path d="M7.2 4.6h4.2v4.2"/>
    </g>
  </g>
</svg>
