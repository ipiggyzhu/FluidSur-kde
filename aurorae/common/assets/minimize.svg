<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- FluidSur titlebutton: minimize.  Monochrome line icon, no traffic light.
     One group per Aurorae state id; the 16x16 rect pins the bounds. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
     viewBox="0 0 16 16" version="1.1">
  <g id="active-center">
    <rect width="16" height="16" fill="#000000" opacity="0"/>
    <g fill="none" stroke="#444444" stroke-width="1.35"
       stroke-linecap="round" stroke-linejoin="round" opacity="1">
      <path d="M4.4 8h7.2"/>
    </g>
  </g>
  <g id="inactive-center">
    <rect width="16" height="16" fill="#000000" opacity="0"/>
    <g fill="none" stroke="#b1b1b1" stroke-width="1.35"
       stroke-linecap="round" stroke-linejoin="round" opacity="1">
      <path d="M4.4 8h7.2"/>
    </g>
  </g>
  <g id="hover-center">
    <rect width="16" height="16" fill="#000000" opacity="0"/>
    <rect width="16" height="16" rx="4" fill="#444444" opacity="0.11"/>
    <g fill="none" stroke="#444444" stroke-width="1.35"
       stroke-linecap="round" stroke-linejoin="round" opacity="1">
      <path d="M4.4 8h7.2"/>
    </g>
  </g>
  <g id="pressed-center">
    <rect width="16" height="16" fill="#000000" opacity="0"/>
    <rect width="16" height="16" rx="4" fill="#444444" opacity="0.2"/>
    <g fill="none" stroke="#444444" stroke-width="1.35"
       stroke-linecap="round" stroke-linejoin="round" opacity="1">
      <path d="M4.4 8h7.2"/>
    </g>
  </g>
  <g id="deactivated-center">
    <rect width="16" height="16" fill="#000000" opacity="0"/>
    <g fill="none" stroke="#444444" stroke-width="1.35"
       stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
      <path d="M4.4 8h7.2"/>
    </g>
  </g>
</svg>
